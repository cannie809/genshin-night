[project]
name = "genshin-night"
version = "2.0.0"
description = "原神 × 狼人杀 — AI 驱动的桌游，单 LLM 实例 + 记忆隔离驱动多角色博弈"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["fastapi",
    "uvicorn",
    "openai",
    "python-dotenv",
    "pydantic>=2.0",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade (modernize syntax)
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (formatter handles it)
    "SIM108", # ternary operator suggestion (readability)
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "ruff>=0.15.2",
]
