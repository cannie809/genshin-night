<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e9d5ff"/>
      <stop offset="50%" style="stop-color:#fff"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c084fc"/>
      <stop offset="100%" style="stop-color:#f87171"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="200" rx="16" fill="url(#bg)"/>
  <!-- Atmospheric orbs -->
  <circle cx="150" cy="100" r="80" fill="#6d28d9" opacity="0.08" filter="url(#softglow)"/>
  <circle cx="650" cy="100" r="80" fill="#dc2626" opacity="0.06" filter="url(#softglow)"/>
  <!-- Border -->
  <rect width="800" height="200" rx="16" fill="none" stroke="url(#accent)" stroke-opacity="0.3" stroke-width="1"/>
  <!-- Decorative line -->
  <line x1="200" y1="130" x2="600" y2="130" stroke="url(#accent)" stroke-width="1" stroke-opacity="0.4"/>
  <!-- Emoji decorations -->
  <text x="100" y="110" font-size="40" opacity="0.6" filter="url(#glow)">🐺</text>
  <text x="660" y="110" font-size="40" opacity="0.6" filter="url(#glow)">🔮</text>
  <!-- Title -->
  <text x="400" y="95" text-anchor="middle" fill="url(#title)" font-size="36" font-weight="700" letter-spacing="3" filter="url(#glow)">原神 × 狼人杀</text>
  <!-- Subtitle -->
  <text x="400" y="155" text-anchor="middle" fill="#a78bfa" font-size="16" letter-spacing="4" opacity="0.9">单机网页版 AI 桌游  ·  记忆隔离  ·  跨局进化</text>
  <!-- Version badge -->
  <g transform="translate(670,16)">
    <rect width="60" height="22" rx="11" fill="#6d28d9" opacity="0.6"/>
    <text x="30" y="15" text-anchor="middle" fill="#e9d5ff" font-size="11" font-weight="500">v2.0</text>
  </g>
</svg>